name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, curl, openssl
          tools: composer
      - run: composer install --no-interaction --no-progress
      - name: PHP syntax
        run: find public server tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Server tests
        run: php tests/run.php

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check and build
        run: pnpm build
      - name: Committed build is up to date
        run: git diff --exit-code --stat -- public/assets public/index.html || (echo "Run pnpm build and commit public/assets." && exit 1)
